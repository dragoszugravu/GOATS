name: Deploy

on:
  push:
    branches: [ "main", "aws-migration" ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::886108961664:role/goats-deploy-role
  AWS_REGION: eu-central-1
  DOMAIN_NAME: fg-goats.com
  HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_TABLE: ${{ secrets.TF_STATE_TABLE }}
  TF_VAR_project_name: goats
  TF_VAR_region: ${{ env.AWS_REGION }}
  TF_VAR_domain_name: fg-goats.com
  TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}
  TF_VAR_github_branch: ${{ github.ref_name }}
  TF_VAR_site_bucket_name: goats-site-fg-goats-com-886108961664
  TF_VAR_manage_custom_domain: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend bundles
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: goats-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          if [ -n "${TF_STATE_BUCKET}" ] && [ -n "${TF_STATE_TABLE}" ]; then \
            terraform init -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_VAR_project_name}/terraform.tfstate" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="dynamodb_table=${TF_STATE_TABLE}"; \
          else \
            terraform init -input=false; \
          fi

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan -var tf_state_bucket=${TF_STATE_BUCKET} -var tf_state_table=${TF_STATE_TABLE}

      - name: Terraform Apply
        if: github.ref_name == env.TF_VAR_github_branch
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export API base to frontend env
        run: |
          API=$(terraform -chdir=infra/terraform output -raw api_base_url)
          echo "VITE_API_BASE=$API" >> frontend/.env
          echo "VITE_COGNITO_USER_POOL_ID=$(terraform -chdir=infra/terraform output -raw cognito_user_pool_id)" >> frontend/.env
          echo "VITE_COGNITO_APP_CLIENT_ID=$(terraform -chdir=infra/terraform output -raw cognito_app_client_id)" >> frontend/.env
          echo "VITE_COGNITO_DOMAIN=$(terraform -chdir=infra/terraform output -raw cognito_user_pool_domain)" >> frontend/.env

      - name: Install frontend deps
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync site to S3
        run: |
          BUCKET=$(terraform -chdir=infra/terraform output -raw site_bucket_name || echo "")
          if [ -z "$BUCKET" ]; then echo "Bucket output missing" && exit 1; fi
          aws s3 sync frontend/dist s3://$BUCKET --delete

      - name: Invalidate CloudFront
        run: |
          CF_ID=$(terraform -chdir=infra/terraform output -raw cloudfront_distribution_id || echo "")
          if [ -z "$CF_ID" ]; then echo "No CF ID output" && exit 1; fi
          aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"


